<body>
<header class="top">
  <div class="signature"><span class="mark" aria-hidden="true">CF</span><div><div class="eyebrow">PENGYI &nbsp; / &nbsp; MOTOR DISTRICT</div><h1>汽车金融城</h1></div></div>
  <div class="top-right"><span class="badge"><b></b> 教学模拟</span><button id="sources" class="quiet" type="button">资料与边界</button><button id="fullscreen" class="quiet fs" type="button" aria-label="切换全屏" title="切换全屏"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button></div>
</header>
<main class="layout">
  <section id="world" class="world" aria-label="汽车金融园区三维地图">
    <canvas id="map" tabindex="0" aria-label="三维地图。点击地面行走，或用方向键和 WASD 移动。"></canvas>
    <div class="map-head"><div class="eyebrow">D I S T R I C T &nbsp; / &nbsp; 01</div><h2>车企供应链园区</h2><p>以比亚迪公开产业生态为参照</p></div>
    <div class="map-tools" aria-label="地图视角"><button id="angleLeft" type="button" aria-label="旋转视角向左" title="旋转视角向左">↶</button><button id="angleRight" type="button" aria-label="旋转视角向右" title="旋转视角向右">↷</button><button id="viewReset" type="button" aria-label="恢复初始视角" title="恢复初始视角">◎</button></div>
    <div id="markers" class="markers"></div>
    <div id="actorBadge" class="actor" aria-hidden="true">CF</div>
    <div id="retailMark" class="retail" aria-hidden="true">终端客户</div>
    <div class="map-foot"><div id="walkStatus" aria-live="polite">点路面行走 · 点建筑选择任务</div><div class="legend" aria-label="流向图例"><span><i class="cargo"></i> 货物流</span><span><i class="paper"></i> 单据／票据</span><span><i class="cash"></i> 资金流</span></div></div>
  </section>
  <aside class="control" aria-label="模拟操作台">
    <div class="control-head"><div class="eyebrow">CF WORKSTATION</div><h2>金融操作台</h2></div>

      <button data-mode="dealer" type="button">经销商</button><button data-mode="supplier" type="button">供应商</button><button data-mode="credit" type="button">主机厂</button><button data-mode="cash" type="button">结算</button>
    </div>
    <div id="partners" class="partners" role="group" aria-label="选择企业"></div>
    <div id="mission" class="mission">
      <div id="stepLabel" class="eyebrow"></div>
      <h3 id="stepTitle"></h3><p id="stepDetail"></p>
      <div id="progress" class="progress" aria-label="任务进度"></div>
      <button id="execute" type="button" class="primary"></button>
      <div id="eventStatus" class="event-status" role="status"></div>

    </div>
  </aside>
</main>

<script>
// Original procedural 3D scene, PENGYI. X east, Y up, Z south; 1 unit ~ 1 m (stylised).
(function(root, make) {
  const api=make();
  if(typeof module==='object') module.exports=api; else root.CF_SCENE=api;
})(globalThis,function(){
  'use strict';
  const VERSION='1.0.0', BOUNDS={x:25,z:16}, SPAWN={x:-5,z:3};
  const plots=[
    {id:'supplier',n:'01',name:'零部件供应商',en:'COMPONENTS',x:-17,z:-7,w:10,d:6.2,h:4.8,accent:'#e8aa60',door:{x:-17,z:-3.05}},
    {id:'oem',n:'02',name:'主机厂',en:'ASSEMBLY CAMPUS',x:0,z:-10,w:15,d:7.2,h:5.9,accent:'#fb786d',door:{x:0,z:-5.38}},
    {id:'d1',n:'03',name:'海岸展厅',en:'DEALER A',x:-.5,z:8.2,w:6.9,d:5,h:2.85,accent:'#76cfff',door:{x:-.5,z:11.55}},
    {id:'d2',n:'04',name:'云港展厅',en:'DEALER B',x:9,z:7.5,w:6.8,d:5,h:2.85,accent:'#8eb1ff',door:{x:9,z:10.85}},
    {id:'d3',n:'05',name:'远山展厅',en:'DEALER C',x:18.5,z:6.8,w:6.6,d:5,h:2.85,accent:'#a4a4ff',door:{x:18.5,z:10.15}},
    {id:'bank',n:'CF',name:'银行操作台',en:'CORPORATE BANK',x:-17,z:7.6,w:8.5,d:6,h:5.3,accent:'#7ff1c2',door:{x:-17,z:11.51}},
  ];
  const spots=Object.fromEntries(plots.map(p=>[p.id,p]));
  // Symbolic origin for payments from outside the six explorable buildings.
  const retail={id:'retail',x:23,z:13.5};
  const capital={id:'capital',x:20.9,z:-1.5};
  const palette={pad:'#243955',road:'#17263a',walk:'#344c61',lane:'#647c8d',metal:'#38506a',
    pale:'#b4c9d7',glass:'#21445d',dark:'#142b3d',green:'#2b7766',trim:'#b3dddf'};
  const tint=(hex,k)=>'#'+[1,3,5].map(i=>Math.round(Math.max(0,Math.min(255,parseInt(hex.slice(i,i+2),16)*k))).toString(16).padStart(2,'0')).join('');
  const face=(m,pts,color,id,normal)=>m.push({pts,color,id,normal});
  function prism(m,ring,y,Y,c,id) {
    face(m,ring.map(([x,z])=>[x,Y,z]),tint(c,1.08),id,[0,1,0]);
    face(m,ring.slice().reverse().map(([x,z])=>[x,y,z]),tint(c,.62),id,[0,-1,0]);
    ring.forEach(([x,z],i)=>{
      const [a,b]=ring[(i+1)%ring.length], norm=Math.hypot(b-z,a-x);
      const nx=-(b-z)/norm,nz=(a-x)/norm;
      const k=.75+.10*(nz+nx*.4);
      face(m,[[x,y,z],[a,y,b],[a,Y,b],[x,Y,z]],tint(c,k),id,[nx,0,nz]);
    });
  }
  function box(m,x,y,z,w,h,d,c,id=null){
    const X=w/2,Z=d/2;
    prism(m,[[x-X,z-Z],[x-X,z+Z],[x+X,z+Z],[x+X,z-Z]],y,y+h,c,id);
  }
  function cylinder(m,x,y,z,rx,h,rz,c,id=null,sides=12){
    prism(m,Array.from({length:sides},(_,i)=>{
      const a=-2*Math.PI*(i+.5)/sides;return [x+Math.cos(a)*rx,z+Math.sin(a)*rz];
    }),y,y+h,c,id);
  }
  function plate(m,x,z,w,d,c){box(m,x,.018,z,w,.014,d,c,c===palette.road||c==='#465f74'?'surface':'mark');}
  function car(m,x,z,c,id=null){
    box(m,x,.14,z,1.20,.31,2.26,c,id);
    box(m,x,.40,z-.12,.95,.43,1.20,'#264660',id);
    box(m,x,.81,z-.12,.93,.085,1.16,c,id);
    for(const dx of [-.63,.63])for(const dz of [-.72,.72]) box(m,x+dx,.025,z+dz,.14,.31,.47,'#172634',id);
    for(const dx of [-.41,.41]){
      box(m,x+dx,.25,z+1.13,.31,.11,.05,'#dcfff9',id);
      box(m,x+dx,.25,z-1.13,.31,.11,.05,'#ed7166',id);
    }
  }
  function truck(m,x,z,c){
    box(m,x,.08,z,1.44,.37,2.95,'#26384b');
    box(m,x,.45,z-.45,1.41,1.05,1.91,c);
    box(m,x,.45,z+1,1.22,.73,.96,'#83a6b6');
    box(m,x,.85,z+1.48,.97,.21,.045,'#2a4c60');
    for(const i of [-1,1])for(const p of [-.98,.95])box(m,x+i*.74,.03,z+p,.16,.44,.48,'#17212b');
  }
  function facade(m,p){
    const {id,x,z,w,d,accent}=p, f=z+d/2, wall=id==='bank'?'#557a7d':'#5d738a';
    box(m,x,.03,z,w+.56,.17,d+.54,'#61788c',id);
    box(m,x,.202,f+.47,w*.92,.09,.73,'#506a7e',id);
    if(id==='supplier'){
      box(m,x,.18,z,w,3.10,d,wall,id);
      box(m,x,3.20,z,w+.32,.33,d+.34,accent,id);
      for(const a of [-2.77,0,2.77]){
        box(m,x+a,.30,f+.03,1.97,2.12,.11,'#142c40',id);
        for(let h=0;h<5;h++)box(m,x+a,.45+h*.36,f+.105,1.82,.073,.04,'#527491',id);
        box(m,x+a,2.51,f+.38,2.24,.16,.88,accent,id);
      }
      for(const a of [-2.6,2.6]) box(m,x+a,3.56,z-.9,3.4,.32,1.35,'#365163',id);
      for(const a of [-3.75,-2.87]){
        cylinder(m,x+a,3.55,z-1.8,.32,1.22,.32,'#a3b8be',id,8);
        cylinder(m,x+a,4.78,z-1.8,.40,.14,.40,'#d9ab73',id,8);
      }
      for(const a of [3.7,4.45]) for(const b of [f+.61,f+1.27]) box(m,x+a,.13,b,.64,.58,.60,'#c18555',id);
    } else if(id==='oem'){
      box(m,x,.18,z,w,4.1,d,'#698297',id);
      box(m,x,4.28,z,w+.29,.36,d+.28,'#b8c8d0',id);
      box(m,x-3.28,4.65,z-.68,7.7,.23,4.62,'#183b56',id);
      for(let i=0;i<6;i++)for(let j=0;j<3;j++)box(m,x-6.45+i*1.28,4.89,z-2.15+j*1.47,1.13,.06,1.30,'#3d7187',id);
      box(m,x+4.95,4.65,z-.94,3.73,.83,3.8,'#677f95',id);
      box(m,x+4.95,5.48,z-.94,3.91,.31,3.98,accent,id);
      box(m,x,3.19,f+.10,w+.14,.33,.27,accent,id);
      for(let i=0;i<7;i++){
        const a=-6.35+i*2.11;
        box(m,x+a,.43,f+.035,1.81,2.53,.145,i===3?'#2b5171':'#19374c',id);
        box(m,x+a,2.52,f+.12,1.73,.17,.055,'#81cbce',id);

    ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke();}
  }
  const screen=pts=>pts.map(cam.project);
  const depth=f=>f.pts.reduce((n,p)=>n+cam.depth(p),0)/f.pts.length;
  function projectFace(f){return {id:f.id,points:screen(f.pts),color:f.color,z:depth(f)};}
  function backdrop(){
    ctx.clearRect(0,0,w,h);ctx.save();
    const fade=ctx.createRadialGradient(w*.46,h*.5,40,w*.46,h*.5,Math.max(w,h)*.64);
    fade.addColorStop(0,'#4c67834c');fade.addColorStop(1,'#52678405');
    ctx.strokeStyle=fade;ctx.lineWidth=.7;
    function line(a,b){const [x,y]=screen([[a[0],-1.3,a[1]],[b[0],-1.3,b[1]]]);ctx.beginPath();ctx.moveTo(x.x,x.y);ctx.lineTo(y.x,y.y);ctx.stroke();}
    for(let i=-65;i<=65;i+=4){line([-65,i],[65,i]);line([i,-65],[i,65]);}
    ctx.restore();
    const blob=ctx.createRadialGradient(w*.49,h*.64,0,w*.49,h*.64,w*.49);
    blob.addColorStop(0,'#030812ad');blob.addColorStop(1,'#05070d00');ctx.fillStyle=blob;ctx.fillRect(0,h*.37,w,h*.55);
  }
  function rebuild(){
    if(w<=20 || h<=20)return;
    cam=N.camera(w,h,angle);
    const terrain=ground.filter(f=>f.id&&cam.visible(f.normal)).map(projectFace).sort((a,b)=>a.z-b.z);
    visible=buildings.concat(ground.filter(f=>!f.id)).filter(f=>cam.visible(f.normal)).map(projectFace).sort((a,b)=>a.z-b.z);
    hits=visible.filter(f=>f.id).reverse();
    // Bake terrain once per view. Game assets stay inspectable as actual X/Y/Z vertices.
    backdrop();
    for(const key of ['base','surface','mark'])for(const f of terrain)if(f.id===key)shape(f.points,f.color,'#101e2c33',.62);
    for(const p of S.plots){
      const X=p.w/2,Z=p.d/2,d=p.z;
      shape(screen([[p.x-X-.3,.039,d-Z],[p.x-X-.2,.039,d+Z+.88],[p.x+X+.84,.039,d+Z+.85],[p.x+X+.68,.039,d-Z]]),'#091b2f57');
    }
    if(!base)base=document.createElement('canvas');base.width=canvas.width;base.height=canvas.height;
    base.getContext('2d').drawImage(canvas,0,0);
    for(const p of S.plots){const a=cam.project([p.x,p.h+.47,p.z+.3]),b=labels.get(p.id);b.style.left=`${a.x}px`;b.style.top=`${a.y}px`;}
    const x=cam.project([S.retail.x,0,S.retail.z]);$('retailMark').style.left=`${x.x}px`;$('retailMark').style.top=`${x.y}px`;
    draw(performance.now());
  }
  function size(){
    const r=canvas.getBoundingClientRect();w=r.width;h=r.height;dpr=Math.min(2,window.devicePixelRatio||1);
    canvas.width=Math.max(1,Math.round(w*dpr));canvas.height=Math.max(1,Math.round(h*dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);rebuild();
  }
  function oval(p,rx,ry,c){ctx.beginPath();ctx.ellipse(p.x,p.y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2);ctx.fillStyle=c;ctx.fill();}
  function routeDraw(){
    if(path.length && target){
      ctx.save();ctx.strokeStyle='#cdf0e399';ctx.lineWidth=1.5;ctx.setLineDash([4,5]);ctx.beginPath();
      const start=cam.project([position.x,.05,position.z]);ctx.moveTo(start.x,start.y);
      for(const p of path){const v=cam.project([p.x,.05,p.z]);ctx.lineTo(v.x,v.y);}ctx.stroke();ctx.restore();
      const a=cam.project([target.x,.06,target.z]);oval(a,9,4,'#78e6bf94');oval(a,4,2,'#e7f7eb');
    }
    if(pin && S.spots[pin]){const p=S.spots[pin].door,a=cam.project([p.x,.05,p.z]);oval(a,6,3,'#91efc58c');}
  }
  function arc(a,b,index){
    const dy=19+Math.min(117,Math.hypot(b.x-a.x,b.y-a.y)*.25)+index*14;
    return {c:{x:(a.x+b.x)/2,y:(a.y+b.y)/2-dy},at(t){const k=1-t;return {x:k*k*a.x+2*k*t*this.c.x+t*t*b.x,y:k*k*a.y+2*k*t*this.c.y+t*t*b.y};}};
  }
  function arrow(p,orientation,r,color){
    const a=orientation;shape([{x:p.x+Math.cos(a)*r,y:p.y+Math.sin(a)*r},{x:p.x+Math.cos(a+2.48)*r,y:p.y+Math.sin(a+2.48)*r},{x:p.x+Math.cos(a-2.48)*r,y:p.y+Math.sin(a-2.48)*r}],color);
  }
  function transfers(now){
    if(!animation)return;
    const delta=now-animation.since;
    for(let i=0;i<animation.events.length;i++){
      const event=animation.events[i],start=point(event.from),end=point(event.to),color=colors[event.type];
      if(!start||!end)continue;
      const a=cam.project([start.x,.15,start.z]),b=cam.project([end.x,.15,end.z]);
      const curve=arc(a,b,i%2),age=delta-i*1050,active=age>=0&&age<1980;
      ctx.save();ctx.globalAlpha=active?.92:age>0?.40:.18;
      ctx.strokeStyle=color;ctx.lineWidth=active?2.55:1.55;ctx.setLineDash(event.type==='paper'?[5,5]:event.type==='cargo'?[10,3]:[3,4]);
      if(active){ctx.shadowColor=color;ctx.shadowBlur=11;}
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo(curve.c.x,curve.c.y,b.x,b.y);ctx.stroke();ctx.setLineDash([]);
      const at=curve.at(.93),tail=curve.at(.89);arrow(at,Math.atan2(at.y-tail.y,at.x-tail.x),5,color);
      if(active&&!media.matches){
        for(let j=0;j<3;j++){
          const t=age/1720-j*.115;if(t<0||t>1)continue;
          const q=curve.at(t),before=curve.at(Math.max(0,t-.018));const dir=Math.atan2(q.y-before.y,q.x-before.x);
          ctx.globalAlpha=1-j*.24;oval(q,j===0?5.8:2.9,j===0?5.8:2.9,color);
          if(j===0)arrow(q,dir,8,color);
        }
      }
      ctx.restore();
    }
  }
  function draw(now){
    if(!base||!cam)return;
    ctx.clearRect(0,0,w,h);ctx.drawImage(base,0,0,w,h);routeDraw();
    const groundPt=cam.project([position.x,.03,position.z]);oval(groundPt,cam.scale*.61,cam.scale*.28,'#0b142998');
    const actor=S.actor(position.x,position.z,phase,path.length>0&&!media.matches,face).filter(f=>cam.visible(f.normal)).map(projectFace);
    const draws=visible.concat(actor).sort((a,b)=>a.z-b.z);
    for(const f of draws)shape(f.points,f.color,'#0d18283f',.54);
    transfers(now);
    const b=cam.project([position.x,1.87,position.z]);$('actorBadge').style.left=`${b.x}px`;$('actorBadge').style.top=`${b.y-2}px`;
  }
  function updateCoord(walking){canvas.dataset.x=position.x.toFixed(3);canvas.dataset.z=position.z.toFixed(3);canvas.dataset.motion=walking?'walking':'idle';}
  function tick(now){
    frameId=0;const dt=Math.min(.045,last?(now-last)/1000:.016);last=now;
    let d=(media.matches?32:15)*dt;
    if(path.length){
      while(path.length){
        const p=path[0],dx=p.x-position.x,dz=p.z-position.z,len=Math.hypot(dx,dz);
        if(len>1e-5)face=Math.atan2(dx,dz);
        if(d>=len){position={...p};d-=len;path.shift();}
        else{position.x+=dx*d/len;position.z+=dz*d/len;break;}
      }
      phase+=dt;updateCoord(path.length>0);
      if(!path.length){const fin=arrival;arrival=null;target=null;fin?.();}
    }
    draw(now);
    if(path.length || animation && !media.matches && now-animation.since<animation.events.length*1050+1400)start();else last=0;
  }
  function start(){if(!frameId)frameId=requestAnimationFrame(tick);}
  function walk(to,label,onArrival){
    const next=N.route(position,to,S.plots,S.BOUNDS);
    if(!next.length){$('walkStatus').textContent='这格不可通行，请点路面或建筑入口。';return false;}
    if(Math.hypot(position.x-to.x,position.z-to.z)<.06){path=[];target=null;arrival=null;updateCoord(false);onArrival?.();return true;}
    path=next;target={...to};arrival=onArrival;
    $('walkStatus').textContent=label?'CF 正前往 '+label:'CF 正在街上行走';updateCoord(true);start();return true;
  }
  function pinState(){for(const [id,m] of labels)m.setAttribute('aria-current',String(pin===id));}
  function choosePlot(id){
    if(movingAction)return;
    pin=id;const p=S.spots[id];
    if(mode==='cash'&&F.CASH[id])party=id;
    else if(F.DEALERS[id]){mode='dealer';dealer=id;}
    else if(id==='supplier')mode='supplier';else if(id==='oem')mode='credit';
    $('eventStatus').textContent=id==='bank'?'银行操作台：按选中流程继续即可。':'';
    ui();walk(p.door,p.name,()=>{ $('walkStatus').textContent='CF 已到达 '+p.name; });
  }
  function inside(p,poly){
    let v=false;
    for(let i=0,j=poly.length-1;i<poly.length;j=i++){
      const a=poly[i],b=poly[j];if((a.y>p.y)!==(b.y>p.y) && p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x)v=!v;
    }
    return v;
  }
  canvas.addEventListener('click',ev=>{
    if(!cam||movingAction)return;
    const b=canvas.getBoundingClientRect(),p={x:ev.clientX-b.left,y:ev.clientY-b.top};
    const f=hits.find(x=>inside(p,x.points));if(f){choosePlot(f.id);return;}
    const g=cam.ground(p.x,p.y);if(Math.abs(g.x)>S.BOUNDS.x+.9 || Math.abs(g.z)>S.BOUNDS.z+.9)return;
    walk(g,null,()=>{$('walkStatus').textContent='CF 已到达 · 可继续点地面或选择建筑';});
  });
  addEventListener('keydown',ev=>{
    if($('modal').open || movingAction || ev.metaKey||ev.ctrlKey||ev.altKey)return;
    const map={w:[0,-1],a:[-1,0],s:[0,1],d:[1,0],arrowup:[0,-1],arrowleft:[-1,0],arrowdown:[0,1],arrowright:[1,0]};
    const dir=map[ev.key.toLowerCase()];if(!dir||ev.target!==canvas && !['w','a','s','d'].includes(ev.key.toLowerCase()))return;
    ev.preventDefault();const [x,z]=dir;
    const t={x:position.x+(x*Math.cos(angle)+z*Math.sin(angle))*3.2,z:position.z+(-x*Math.sin(angle)+z*Math.cos(angle))*3.2};
    if(!N.free(t,S.plots,S.BOUNDS))return;walk(t,null,()=>{$('walkStatus').textContent='CF 已到达 · 键盘或点击可继续移动';});
  });
  function current(){return F.action(state,mode,mode==='cash'?party:dealer);}
  function steps(){
    if(mode==='dealer')return {done:state.dealers[dealer].stage+(state.facility?1:0),count:7,text:F.DEALERS[dealer].name+' · 经销商银承'};
    if(mode==='supplier')return {done:state.supplier,count:3,text:'供应商 · 应收融资'};
    if(mode==='cash')return {done:state.accounts[party]?1:0,count:1,text:F.CASH[party]+' · 账户服务'};
    return {done:state.facility?1:0,count:1,text:'主机厂 · 授信框架'};
  }
  function activeButtons(){
    for(const b of document.querySelectorAll('[data-mode]')){b.setAttribute('aria-pressed',String(b.dataset.mode===mode));b.disabled=!!movingAction;}
    const deck=$('partners');deck.replaceChildren();const choices=mode==='dealer'?Object.fromEntries(Object.entries(F.DEALERS).map(([id,p])=>[id,p.name])):mode==='cash'?F.CASH:{};
    for(const [id,name] of Object.entries(choices)){
      const b=node('button',name);b.type='button';b.dataset.party=id;b.disabled=!!movingAction;
      b.setAttribute('aria-pressed',String(id===(mode==='dealer'?dealer:party)));
      b.addEventListener('click',()=>{if(mode==='dealer')dealer=id;else party=id;pin=id;$('eventStatus').textContent='';ui();const p=S.spots[id];walk(p.door,p.name,()=>{$('walkStatus').textContent='CF 已到达 '+p.name;});});deck.appendChild(b);
    }
  }
  function amount(e){return e.amount==null?'':e.type==='cargo'?`${e.amount} 台`:F.fmt(e.amount);}
  function ui(){
    activeButtons();pinState();const n=steps(), act=current(),m=F.metrics(state),row=state.ledger.at(-1);
    $('stepLabel').textContent=`${n.text} · ${n.done} / ${n.count}`;
    $('stepTitle').textContent=act?.title??'这条路线已完成';
    $('stepDetail').textContent=act?.detail??(mode==='dealer'?'车辆、到期兑付和保证金状态已闭环。可以切换另一家展厅或打开流水。':mode==='supplier'?'应收已按本案回款顺序结清。可以打开流水复核资金拆分。':'已登记模拟状态。现在可以继续其他业务路线。');
    const progress=$('progress');progress.replaceChildren();for(let i=0;i<n.count;i++)progress.append(node('b',null,i<n.done?'past':i===n.done?'current':''));
    $('execute').disabled=!act||!!movingAction;$('execute').textContent=movingAction?'CF 正在前往办理地点…':act?.button??'已完成';
    if(row){const box=$('recent');box.replaceChildren();for(const ev of row.events){const span=node('span','','read');span.append(node('i',kind[ev.type]+' · ',ev.type),document.createTextNode(ev.label+(amount(ev)?' · '+amount(ev):'')));box.append(span);}}
    else $('recent').textContent='还没有模拟交易。完成首个任务，看钱、车和票据如何流动。';
    for(const k of ['exposure','locked','recovered','arOutstanding'])$(k).textContent=F.fmt(m[k]);
    $('exposure').title=`模拟框架 ${F.fmt(m.limit)}，剩余额度 ${F.fmt(m.available)}`;
    $('delivered').textContent=m.delivered+' 台';$('linked').textContent=m.linked+' / 5';$('replay').disabled=!row||!!movingAction;
    canvas.dataset.actions=String(state.ledger.length);canvas.dataset.completed=String(m.closed);
    draw(performance.now());
  }
  function replay(events){animation={events,since:media.matches?performance.now()-4000:performance.now()};start();}
  function finish(act){
    const r=F.apply(state,act.id);movingAction=null;
    if(!r.ok){$('eventStatus').textContent=r.error;ui();return;}
    state=r.state;$('eventStatus').textContent=`第 ${r.row.number} 笔 · 模拟完成`;
    $('walkStatus').textContent='CF 已到达 '+S.spots[act.at].name+' · 操作已写入模拟流水';
    replay(r.events);ui();
  }
  $('execute').addEventListener('click',()=>{
    const act=current();if(!act||movingAction)return;
    movingAction=act;pin=act.at;ui();
    if(!walk(S.spots[act.at].door,S.spots[act.at].name,()=>finish(act))){movingAction=null;ui();}
  });
  for(const b of document.querySelectorAll('[data-mode]'))b.addEventListener('click',()=>{
    if(movingAction)return;mode=b.dataset.mode;pin=mode==='dealer'?dealer:mode==='cash'?party:mode==='credit'?'oem':'supplier';$('eventStatus').textContent='';ui();
  });
  $('replay').addEventListener('click',()=>{const r=state.ledger.at(-1);if(r&&!movingAction)replay(r.events);});
  function reset(){state=F.fresh();mode='dealer';dealer='d1';party='oem';pin='oem';position={...S.SPAWN};path=[];arrival=null;movingAction=null;target=null;animation=null;face=0;phase=0;
    $('eventStatus').textContent='演练已重开，流水已清空。';$('walkStatus').textContent='点路面行走 · 点建筑选择任务';updateCoord(false);ui();}
  $('reset').addEventListener('click',reset);
  $('angleLeft').addEventListener('click',()=>{angle-=.21;rebuild();});$('angleRight').addEventListener('click',()=>{angle+=.21;rebuild();});$('viewReset').addEventListener('click',()=>{angle=.26;rebuild();});
  $('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else $('walkStatus').textContent='浏览器不支持全屏按钮，可在新窗口打开。';}catch{$('walkStatus').textContent='浏览器未允许本次全屏。';}});
  function modal(title){$('modalTitle').textContent=title;$('modalBody').replaceChildren();$('modal').showModal();return $('modalBody');}
  $('ledger').addEventListener('click',()=>{
    const b=modal('模拟流水'),m=F.metrics(state);
    b.append(node('p',`当前使用 ${F.fmt(m.exposure)}／已授信 ${F.fmt(m.limit)}；累计承兑手续费 ${F.fmt(m.fees)}；已结应收融资费用 ${F.fmt(m.arFee)}。`));
    if(!state.ledger.length)b.append(node('p','还没有模拟流水。'));
    for(const row of state.ledger.slice().reverse()){
      const a=node('article');a.append(node('strong',`第 ${row.number} 笔 · ${row.title}`));
      for(const e of row.events)a.append(node('p',`${nodeName(e.from)} → ${nodeName(e.to)}：${e.label}${amount(e)?' · '+amount(e):''}`));b.append(a);
    }
  });
  $('sources').addEventListener('click',()=>{
    const b=modal('资料与边界');
    b.append(node('p','比亚迪公开披露提供产业结构参照，不是本游戏的交易对手。所有展厅、供应商、银行、账户、价格和融资类参数均为虚构。没有比亚迪背书，也不含任何真实合同、办理入口或客户数据。'));
    const refs=[['比亚迪 2025 年可持续发展报告 · 供应链','https://www.bydglobal.com/material/__CN/group-official-website/file/en/esg/report/2025-byd-sustainability-report-en.pdf'],['比亚迪官方售前帮助中心 · 经销商与门店','https://www.byd.com/cn/help-center'],['建设银行 · 汽贸融','https://member.ccb.com/chn/company/gsjgsy/cpfw/gsyw/gylrzyw/qmr/index.shtml'],['建设银行 · 银行承兑汇票','https://ebank.ccb.com/chn/company/gsjgsy/cpfw/gsyw/pjyw/yxcdhp/index.shtml'],['农业银行 · 国内保理','https://www.abchina.com/cn/businesses/financing/dsttradefinace/201207/t20120725_787494.htm']];
    const l=node('ul');for(const [text,href] of refs){const item=node('li'),a=node('a',text);a.href=href;a.target='_blank';a.rel='noopener noreferrer';item.append(a);l.append(item);}b.append(l,node('p','访问日期 2026-11-23。教学产品流程简化，并非银行合规、收费或授信建议。'+F.DEMO));
  });
  new ResizeObserver(size).observe(canvas);size();ui();updateCoord(false);canvas.dataset.ready='true';
})();
</script>
